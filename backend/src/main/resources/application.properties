# ===================================
# Spring Boot Application Properties
# ===================================

# Application
spring.application.name=mock-interview-portal
server.address=0.0.0.0
server.port=${PORT:8080}

# ===================================
# Database Configuration
# Managed by DatabaseConfig: automatically uses Cloud MySQL if reachable,
# or embedded H2 database as resilient zero-config fallback.
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=YOUR_VERY_LONG_SECRET_KEY_HERE_CHANGE_THIS_IN_PRODUCTION_MUST_BE_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# ===================================
# OpenRouter / AI Configuration
# ===================================
app.openai.api-key=${OPENROUTER_API_KEY:sk-or-v1-placeholder}
app.openai.model=${OPENAI_MODEL:meta-llama/llama-3-8b-instruct}
app.openai.base-url=${OPENAI_BASE_URL:https://openrouter.ai/api/v1}

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=http://localhost:3000
