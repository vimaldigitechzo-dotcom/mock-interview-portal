# ===================================
# Spring Boot Application Properties
# ===================================

# Application
spring.application.name=mock-interview-portal
server.port=${PORT:8080}

# ===================================
# Database Configuration
# Automatically detects driver from JDBC URL (MySQL or H2)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mock_interview_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP: Non-blocking initialization so the server starts reliably
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=YOUR_VERY_LONG_SECRET_KEY_HERE_CHANGE_THIS_IN_PRODUCTION_MUST_BE_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# ===================================
# OpenRouter / AI Configuration
# ===================================
app.openai.api-key=${OPENROUTER_API_KEY:sk-or-v1-placeholder}
app.openai.model=${OPENAI_MODEL:meta-llama/llama-3-8b-instruct}
app.openai.base-url=${OPENAI_BASE_URL:https://openrouter.ai/api/v1}

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=http://localhost:3000
