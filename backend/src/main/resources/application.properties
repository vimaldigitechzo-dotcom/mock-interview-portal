# ===================================
# Spring Boot Application Properties
#===================================

# Application
spring.application.name=mock-interview-portal
server.port=${PORT:8080}

# ===================================
# MySQL Database Configuration
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mock_interview_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=YOUR_VERY_LONG_SECRET_KEY_HERE_CHANGE_THIS_IN_PRODUCTION_MUST_BE_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# ===================================
# Google OAuth 2.0 Configuration
# ===================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# ===================================
# OpenAI API Configuration
# ===================================
#app.openai.api-key=your-openai-api-key-here
#app.openai.model=gpt-4o-mini

# Replace OpenAI with OpenRouter (free models)
app.openai.api-key=sk-or-v1-your-openrouter-key
app.openai.model=meta-llama/llama-3-8b-instruct
app.openai.base-url=https://openrouter.ai/api/v1

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=http://localhost:3000
